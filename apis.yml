aid: grabcad
name: GrabCAD
description: 'GrabCAD, a Stratasys company, operates a connected additive-manufacturing
  platform spanning the GrabCAD Community Library of free CAD models, GrabCAD Print
  and Print Pro for driving Stratasys 3D printers, GrabCAD Shop for shop-floor job
  management, and the GrabCAD Software Development Kit / Software Partner Program.
  For developers, GrabCAD exposes the GrabCAD Print API (print-api.grabcad.com) plus
  a family of SDKs — MTConnect data streaming, a Printer Connectivity SDK for ERP/PLM/MES
  integration, a PLM SDK, and an FDM printer emulator — that let ISVs and enterprises
  integrate Stratasys printers and GrabCAD Print into their own manufacturing software
  ecosystems.'
