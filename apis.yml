apis:
- name: GrabCAD Print API
  description: 'The GrabCAD Print API lets partner and enterprise software drive Stratasys
    3D printers and GrabCAD Print workflows programmatically — submitting and managing
    print jobs, retrieving printer and job status, and connecting factory-floor systems.
    Access is gated behind GrabCAD account credentials and the GrabCAD Software Partner
    Program; the interactive documentation is published at print-api.grabcad.com but
    requires login.'
